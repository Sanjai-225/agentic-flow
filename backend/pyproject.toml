[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045", "UP006", "UP035", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires real external services/credentials (opt-in with -m live)"]
