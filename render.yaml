# Render Blueprint for the Agentic Flow backend (FastAPI) - FREE instance type.
# Spec: https://render.com/docs/blueprint-spec  - schema: https://render.com/schema/render.yaml.json
# Step-by-step guide: docs/PRODUCTION_DEPLOYMENT.md
#
# One free web service runs the API, the execution worker (in-process) and the Schedule Trigger loop.
# No Docker, Redis, separate worker, cron job or Render database is used (Supabase provides PostgreSQL).
#
# FREE-TIER LIMITS (guide, section "Free-tier limitations"):
#   * the service sleeps after ~15 minutes without incoming HTTP requests; the next request wakes it (~1 min);
#   * while it sleeps, Schedule Triggers do not fire (missed times follow each trigger's misfire policy);
#   * runs still executing when the service sleeps or restarts are marked "interrupted".
services:
  - type: web
    name: agentic-flow-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore         # same region as the Supabase project (ap-southeast-1) for low database latency
    branch: main
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/tests/**
        - backend/**/*.md
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # One process only: executions, cancellation and rate limits live in this process.
    # --proxy-headers/--forwarded-allow-ips: real client IP behind Render's proxy (used by rate limits).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips "*" --timeout-graceful-shutdown 25 --no-server-header
    healthCheckPath: /health
    previews:
      generation: "off"       # preview environments would share the production database
    envVars:
      # ---- runtime ------------------------------------------------------------------------------------
      - key: PYTHON_VERSION
        value: "3.13"
      - key: APP_ENV
        value: production
      # ---- database (Supabase) ------------------------------------------------------------------------
      - key: DATABASE_URL
        sync: false           # Supabase > Connect > Session pooler URI (port 5432) with your DB password
      - key: DB_AUTO_MIGRATE
        value: "true"         # apply the (additive) migrations automatically at startup - no manual step
      - key: DB_POOL_SIZE
        value: "3"            # small pool for the Supabase free-tier session pooler
      - key: DB_MAX_OVERFLOW
        value: "2"
      # ---- secrets ------------------------------------------------------------------------------------
      - key: JWT_SECRET
        generateValue: true   # generated by Render; rotating it only signs every user out
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false           # python scripts/generate_secrets.py ; keep a copy - never change it afterwards
      # ---- URLs (PUBLIC_BASE_URL comes from Render's RENDER_EXTERNAL_URL automatically) ----------------
      - key: PUBLIC_APP_URL
        sync: false           # your Vercel URL, e.g. https://<project>.vercel.app (no trailing slash)
      - key: CORS_ORIGINS
        sync: false           # the same Vercel URL (comma-separate several; no trailing slash)
      # ---- AI -------------------------------------------------------------------------------------------
      - key: GEMINI_API_KEY
        sync: false           # AI workflow designer; without a real key it runs in labelled mock mode
      - key: AI_ALLOW_PLATFORM_KEYS
        value: "false"        # users add their own OpenAI/Anthropic/Gemini keys as encrypted credentials
      # ---- safety -----------------------------------------------------------------------------------------
      - key: HTTP_ALLOW_PRIVATE_NETWORKS
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
